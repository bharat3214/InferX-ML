<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Neural graph -->
  <g stroke="url(#stroke)" stroke-width="2.1" stroke-linecap="round" fill="none" opacity="0.78">
    <path d="M15 45 L31 32"/>
    <path d="M15 45 L31 44"/>
    <path d="M15 34 L31 32"/>
    <path d="M31 32 L49 22"/>
    <path d="M31 44 L49 22"/>
    <path d="M31 44 L49 42"/>
  </g>

  <!-- Nodes -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="15" cy="45" r="3.1"/>
    <circle cx="15" cy="34" r="3.1"/>
    <circle cx="31" cy="32" r="3.1"/>
    <circle cx="31" cy="44" r="3.1"/>
  </g>

  <!-- Output node, brighter -->
  <circle cx="49" cy="22" r="4.1" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="49" cy="42" r="3.4" fill="#a5f3fc" filter="url(#glow)"/>
</svg>
